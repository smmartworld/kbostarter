name: KBO Data Auto Update

on:
  schedule:
    - cron: '30 14 * * *' 
  workflow_dispatch: 

jobs:
  update-kbo-data:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # 모든 기록 가져오기 (충돌 방지)

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas beautifulsoup4

    - name: Run data crawler
      run: python data.py

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        
        # 🔥 충돌 방지를 위해 먼저 최신 상태 땡겨오기
        git pull origin main --rebase
        
        git add 로테이션_마스터데이터.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "⚾ 매일 KBO 데이터 자동 업데이트 완료!" && git push origin HEAD:main)
