name: KBO Data Auto Update

on:
  schedule:
    # 매 2시간마다 17분에 실행 (예: 00:17, 02:17, 04:17 ...)
    - cron: '56 */2 * * *'
    
  workflow_dispatch:

jobs:
  update-kbo-data:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas beautifulsoup4 lxml

    - name: Run KBO data crawler
      run: python data.py

    - name: Run pitcher advanced stats collector
      # Naver API(WAR/K%/BB%) + Statiz(FIP) 통합 수집
      # 실패해도 기존 pitcher_advanced_stats.csv 보존 (앱 안전)
      run: python naver_stats.py || echo "⚠️ 심화 스탯 수집 실패 - 기존 데이터 유지"
      continue-on-error: true

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        
        # 꼬임 방지를 위해 최신 코드 먼저 땡겨오기
        git pull origin main --rebase || echo "No changes to pull"
        
        git add 로테이션_마스터데이터.csv
        # statiz_stats.csv도 변경됐을 때만 커밋에 포함
        git add pitcher_advanced_stats.csv 2>/dev/null || true
        git diff --quiet && git diff --staged --quiet || (git commit -m "⚾ KBO 데이터 자동 업데이트 완료!" && git push origin HEAD:main)
